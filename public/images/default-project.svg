<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F4C81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#144f84;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F9D423;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8c404;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5a96;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d3d6b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Sky subtle glow -->
  <ellipse cx="400" cy="80" rx="300" ry="120" fill="#F9D423" opacity="0.06" />

  <!-- Ground -->
  <rect x="0" y="320" width="800" height="130" fill="url(#groundGrad)" opacity="0.5" />

  <!-- Sun -->
  <circle cx="400" cy="140" r="48" fill="url(#sunGrad)" opacity="0.9" />

  <!-- Sun rays -->
  <g stroke="#F9D423" stroke-width="3" opacity="0.5">
    <line x1="400" y1="70"  x2="400" y2="50"  />
    <line x1="400" y1="210" x2="400" y2="230" />
    <line x1="330" y1="140" x2="310" y2="140" />
    <line x1="470" y1="140" x2="490" y2="140" />
    <line x1="350" y1="90"  x2="336" y2="76"  />
    <line x1="450" y1="190" x2="464" y2="204" />
    <line x1="450" y1="90"  x2="464" y2="76"  />
    <line x1="350" y1="190" x2="336" y2="204" />
  </g>

  <!-- Solar panels group -->
  <!-- Panel 1 -->
  <g transform="translate(160, 280)">
    <rect x="0" y="-60" width="90" height="60" rx="4" fill="#1a3d5c" stroke="#2a5f8f" stroke-width="1.5" />
    <line x1="30" y1="-60" x2="30" y2="0" stroke="#2a5f8f" stroke-width="1" />
    <line x1="60" y1="-60" x2="60" y2="0" stroke="#2a5f8f" stroke-width="1" />
    <line x1="0" y1="-40" x2="90" y2="-40" stroke="#2a5f8f" stroke-width="1" />
    <line x1="0" y1="-20" x2="90" y2="-20" stroke="#2a5f8f" stroke-width="1" />
    <rect x="0" y="-60" width="90" height="60" rx="4" fill="#F9D423" opacity="0.08" />
    <!-- pole -->
    <line x1="45" y1="0" x2="45" y2="20" stroke="#cfc6ac" stroke-width="3" />
  </g>

  <!-- Panel 2 -->
  <g transform="translate(290, 270)">
    <rect x="0" y="-60" width="90" height="60" rx="4" fill="#1a3d5c" stroke="#2a5f8f" stroke-width="1.5" />
    <line x1="30" y1="-60" x2="30" y2="0" stroke="#2a5f8f" stroke-width="1" />
    <line x1="60" y1="-60" x2="60" y2="0" stroke="#2a5f8f" stroke-width="1" />
    <line x1="0" y1="-40" x2="90" y2="-40" stroke="#2a5f8f" stroke-width="1" />
    <line x1="0" y1="-20" x2="90" y2="-20" stroke="#2a5f8f" stroke-width="1" />
    <rect x="0" y="-60" width="90" height="60" rx="4" fill="#F9D423" opacity="0.08" />
    <line x1="45" y1="0" x2="45" y2="20" stroke="#cfc6ac" stroke-width="3" />
  </g>

  <!-- Panel 3 -->
  <g transform="translate(420, 280)">
    <rect x="0" y="-60" width="90" height="60" rx="4" fill="#1a3d5c" stroke="#2a5f8f" stroke-width="1.5" />
    <line x1="30" y1="-60" x2="30" y2="0" stroke="#2a5f8f" stroke-width="1" />
    <line x1="60" y1="-60" x2="60" y2="0" stroke="#2a5f8f" stroke-width="1" />
    <line x1="0" y1="-40" x2="90" y2="-40" stroke="#2a5f8f" stroke-width="1" />
    <line x1="0" y1="-20" x2="90" y2="-20" stroke="#2a5f8f" stroke-width="1" />
    <rect x="0" y="-60" width="90" height="60" rx="4" fill="#F9D423" opacity="0.08" />
    <line x1="45" y1="0" x2="45" y2="20" stroke="#cfc6ac" stroke-width="3" />
  </g>

  <!-- Panel 4 -->
  <g transform="translate(550, 270)">
    <rect x="0" y="-60" width="90" height="60" rx="4" fill="#1a3d5c" stroke="#2a5f8f" stroke-width="1.5" />
    <line x1="30" y1="-60" x2="30" y2="0" stroke="#2a5f8f" stroke-width="1" />
    <line x1="60" y1="-60" x2="60" y2="0" stroke="#2a5f8f" stroke-width="1" />
    <line x1="0" y1="-40" x2="90" y2="-40" stroke="#2a5f8f" stroke-width="1" />
    <line x1="0" y1="-20" x2="90" y2="-20" stroke="#2a5f8f" stroke-width="1" />
    <rect x="0" y="-60" width="90" height="60" rx="4" fill="#F9D423" opacity="0.08" />
    <line x1="45" y1="0" x2="45" y2="20" stroke="#cfc6ac" stroke-width="3" />
  </g>

  <!-- Text label -->
  <text x="400" y="400" text-anchor="middle" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="600" fill="white" opacity="0.5">Proyek Energi Terbarukan</text>
</svg>
